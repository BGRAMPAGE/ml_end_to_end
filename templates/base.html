<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Customer Churn AI
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f5f7fb;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .hero {
            padding: 80px 0;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .metric-card {
            padding: 25px;
            text-align: center;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
        }

    </style>

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            Customer Churn AI
        </a>


        <div>

            <a
                class="btn btn-outline-light btn-sm me-2"
                href="/predict"
            >
                Predict
            </a>

            <a
                class="btn btn-outline-light btn-sm me-2"
                href="/models"
            >
                Models
            </a>

            <a
                class="btn btn-outline-light btn-sm"
                href="/analytics"
            >
                Analytics
            </a>

        </div>

    </div>

</nav>


<main class="container py-4">

    {% block content %}

    {% endblock %}

</main>


<footer class="text-center text-muted py-4">

    <small>
        Customer Churn Prediction • Machine Learning Project
    </small>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
